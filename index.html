const $=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,fmt=n=>new Intl.NumberFormat('es-ES').format(Math.round(n)),money=n=>fmt(n)+' M€',escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function buy(id){let p=game.market.find(x=>x.id===id);if(!p||p.value>game.budget)return;game.budget-=p.value;p.club=game.team;game.players.push(p);game.market=game.market.filter(x=>x.id!==id);addNews('Fichado '+p.name+' por '+money(p.value));save();renderView()}
function sell(id){let p=squad().find(x=>x.id===id);if(!p||squad().length<=11)return alert('Necesitas al menos 11 jugadores.');if(!confirm('¿Vender a '+p.name+' por '+money(p.value)+'?'))return;game.budget+=p.value;game.players=game.players.filter(x=>x.id!==id);addNews('Traspaso de '+p.name);save();renderView()}
function train(){if(game.lastTraining===game.round)return alert('Ya has entrenado esta jornada.');game.lastTraining=game.round;for(let p of squad()){let f=game.training==='suave'?12:game.training==='intenso'?-12:5;p.fitness=Math.max(45,Math.min(100,p.fitness+f));if(Math.random()<(game.training==='intenso'?.22:.08)&&p.rating<95)p.rating++;}addNews('Sesión de entrenamiento: '+game.training);save();renderView()}
function upgrade(){if(game.budget<20)return;game.budget-=20;game.stadium+=5000;addNews('Estadio ampliado a '+fmt(game.stadium));save();renderView()}
function goals(strength,other){let expectation=Math.max(.35,1.25+(strength-other)*.055);let n=0;for(let i=0;i<6;i++)if(Math.random()<expectation/6)n++;return n}
function result(f,hg,ag){if(f.played)return;f.played=true;let h=game.table[f.home],a=game.table[f.away];h.p++;a.p++;h.gf+=hg;h.ga+=ag;a.gf+=ag;a.ga+=hg;if(hg>ag){h.w++;a.l++;h.pts+=3}else if(ag>hg){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}game.history.push({round:f.round,home:f.home,away:f.away,hg,ag});}
function finishRound(f,hg,ag){result(f,hg,ag);for(let x of game.fixtures.filter(x=>x.round===game.round&&!x.played)){let ah=avg(x.home),aa=avg(x.away);result(x,goals(ah+3,aa),goals(aa,ah+3));}let home=f.home===game.team;let reward=home?game.stadium*game.ticket*.000001*(.65+Math.random()*.3):.6;game.budget+=reward-squad().reduce((s,p)=>s+p.wage,0)/10;for(let p of squad())p.fitness=Math.max(50,p.fitness-rnd(5,12));addNews('J'+game.round+': '+CLUBS[f.home]+' '+hg+'-'+ag+' '+CLUBS[f.away]);game.round++;game.lastTraining=0;save();}
function kickoff(){if(match)return;let f=nextFixture();if(!f)return;let hs=avg(f.home)+(f.home===game.team?(game.mentality==='ofensiva'?2:game.mentality==='defensiva'?-1:0):0),as=avg(f.away)+(f.away===game.team?(game.mentality==='ofensiva'?2:game.mentality==='defensiva'?-1:0):0);let hg=goals(hs+3,as),ag=goals(as,hs+3);let events=[];for(let i=0;i<hg;i++)events.push({t:rnd(4,88),home:true});for(let i=0;i<ag;i++)events.push({t:rnd(4,88),home:false});events.sort((a,b)=>a.t-b.t);match={f,hg,ag,events,start:performance.now(),duration:22000,shown:0,eh:0,ea:0};$('kick').disabled=true;animateMatch();}
function animateMatch(){if(!match)return;let m=match,elapsed=performance.now()-m.start,minute=Math.min(90,Math.floor(elapsed/m.duration*90));while(m.shown<m.events.length&&m.events[m.shown].t<=minute){let e=m.events[m.shown++];if(e.home)m.eh++;else m.ea++;$('commentary').textContent='⚽ ¡GOOOL! '+CLUBS[e.home?m.f.home:m.f.away]+' · Minuto '+e.t;}$('score').textContent=CLUBS[m.f.home]+' '+m.eh+' - '+m.ea+' '+CLUBS[m.f.away];$('clock').textContent=String(minute).padStart(2,'0')+':00';drawPitch(elapsed/450,minute);if(elapsed<m.duration){raf=requestAnimationFrame(animateMatch)}else{let f=m.f,h=m.hg,a=m.ag;match=null;finishRound(f,h,a);$('commentary').innerHTML='Final del partido. <button class="primary" onclick="go(\'inicio\')">Continuar jornada →</button>';}}
function drawPitch(t,minute){let c=$('pitch');if(!c)return;let ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#152a48');sky.addColorStop(1,'#081e1b');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#233c4e':'#1d3444';ctx.fillRect(0,80+i*12,w,12)}function proj(x,y){let depth=(y+1)/2;return{x:w/2+x*(300+155*depth),y:150+depth*335}}function line(points,color='#d7f5e5',width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();points.forEach(([x,y],i)=>{let p=proj(x,y);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.stroke()}let corners=[[-1,-1],[1,-1],[1,1],[-1,1]];ctx.beginPath();corners.forEach(([x,y],i)=>{let p=proj(x,y);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.closePath();ctx.fillStyle='#21834f';ctx.fill();ctx.save();ctx.clip();for(let i=0;i<10;i++){let a=proj(-1,-1+i*.2),b=proj(1,-1+i*.2),d=proj(-1,-.8+i*.2),e=proj(1,-.8+i*.2);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(e.x,e.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fillStyle=i%2?'#258f55':'#21834f';ctx.fill()}ctx.restore();line([...corners,corners[0]]);line([[0,-1],[0,1]]);let circle=[];for(let a=0;a<=32;a++){let r=a*Math.PI/16;circle.push([Math.cos(r)*.17,Math.sin(r)*.30])}line(circle);line([[-.55,-1],[-.55,-.67],[.55,-.67],[.55,-1]]);line([[-.55,1],[-.55,.67],[.55,.67],[.55,1]]);line([[-.25,-1],[-.25,-.85],[.25,-.85],[.25,-1]]);line([[-.25,1],[-.25,.85],[.25,.85],[.25,1]]);let people=[];for(let side=0;side<2;side++)for(let i=0;i<11;i++){let x=(i%4-1.5)*.36+(Math.sin(t*.7+i*2+side)*.055),y=(side?-.52:.52)+(Math.floor(i/4)-1)*.24+Math.cos(t*.8+i)*.04;people.push({x,y,side})}people.sort((a,b)=>a.y-b.y);for(let p of people){let q=proj(p.x,p.y),s=7+(p.y+1)*3;ctx.fillStyle='#0a2423aa';ctx.beginPath();ctx.ellipse(q.x+4,q.y+3,s*.8,s*.3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.side?COLORS[match?match.f.away:1]:COLORS[match?match.f.home:0];ctx.fillRect(q.x-s*.45,q.y-s*1.65,s*.9,s*1.3);ctx.fillStyle='#edc6a1';ctx.beginPath();ctx.arc(q.x,q.y-s*1.95,s*.37,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eaf4fc';ctx.fillRect(q.x-s*.38,q.y-s*.35,s*.27,s*.65);ctx.fillRect(q.x+s*.1,q.y-s*.35,s*.27,s*.65)}let ball=proj(Math.sin(t*.95)*.7,Math.cos(t*.67)*.7);ctx.fillStyle='white';ctx.beginPath();ctx.arc(ball.x,ball.y,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#071b22';ctx.font='bold 15px system-ui';ctx.fillText('FOOTBALL DYNASTY · SIMULACIÓN 3D',20,30);}
function newSeason(){let champion=[...game.table].sort((a,b)=>b.pts-a.pts)[0];addNews('Campeón de liga: '+CLUBS[champion.id]);let old=game;currentLeague=old.league||currentLeague;CLUBS=LEAGUES[currentLeague];game=makeGame(old.team);game.season=old.season+1;game.players=old.players;game.market=old.market;game.budget=old.budget+20;game.stadium=old.stadium;game.formation=old.formation;game.mentality=old.mentality;game.training=old.training;game.news=['¡Arranca la temporada '+game.season+'!'];save();go('inicio')}

function continentalName(){let x=currentLeague.split(' · ')[0];return ['España','Inglaterra','Italia','Alemania','Francia','Portugal','Países Bajos'].includes(x)?'Copa de Campeones de Europa': ['Brasil','Argentina','Uruguay','Chile','Colombia','Paraguay','Perú'].includes(x)?'Copa Continental Sudamericana':x==='México'||x==='Estados Unidos'?'Copa de Campeones CONCACAF': ['Japón','Corea del Sur','China','Arabia Saudí','India'].includes(x)?'Liga de Campeones de Asia':'Copa Continental';}
function continentalRound(){if(!game.cup)game.cup={round:0,alive:true,history:[]};let c=game.cup;if(!c.alive)return;let rival=CLUBS[rnd(0,CLUBS.length-1)];let a=goals(avg(game.team)+3,76),b=goals(76,avg(game.team));if(a===b){if(Math.random()<.5)a++;else b++;}c.round++;c.alive=a>b;c.history.unshift('Ronda '+c.round+': '+CLUBS[game.team]+' '+a+'-'+b+' '+rival+(c.alive?' · Clasificado':' · Eliminado'));game.budget+=c.alive?4:1;addNews(c.history[0]);if(c.round>=4&&c.alive){c.history.unshift('🏆 ¡Campeón de '+continentalName()+'!');game.budget+=30;c.alive=false;}save();go('internacional')}

newSeason=function(){let old=game,originalTeam=game.team,rank=tableSorted(),champ=CLUBS[rank[0].id],link=findDiv(currentLeague),index=link?link.indexOf(currentLeague):-1,target=currentLeague;let position=rank.findIndex(x=>x.id===old.team);if(link&&index>0&&position<2)target=link[index-1];else if(link&&index<link.length-1&&position>=CLUBS.length-2)target=link[index+1];let oldClub=CLUBS[old.team];let messages=['Campeón de '+currentLeague+': '+champ];if(target!==currentLeague){let promoted=link.indexOf(target)<index;messages.push((promoted?'⬆️ Ascenso':'⬇️ Descenso')+' de '+oldClub+' a '+target);let incoming=LEAGUES[target];let replace=incoming.indexOf(oldClub);if(replace<0){replace=promoted?incoming.length-1:0;incoming[replace]=oldClub}currentLeague=target;CLUBS=incoming;old.team=replace;}else{messages.push('Continúas en '+currentLeague)}let preserved=old.players.filter(p=>p.club===originalTeam);let oldTeamIndex=old.team;game=makeGame(oldTeamIndex);game.season=old.season+1;game.budget=old.budget+20+(position===0?15:0);game.stadium=old.stadium;game.formation=old.formation;game.mentality=old.mentality;game.training=old.training;game.news=messages;game.cup={round:0,alive:true,history:[]};if(target===old.league){game.players=old.players;game.market=old.market}else{for(let p of game.players)if(p.club===oldTeamIndex)p.club=-2;for(let p of preserved){p.club=oldTeamIndex;game.players.push(p)}}game.league=currentLeague;save();go('inicio')};


// Mundo persistente: ligas paralelas, movimientos de clubes y clasificación continental.
const WORLD_VERSION=3;
function worldRow(name){return {name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}}
function worldOrder(rows){return [...rows].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.name.localeCompare(b.name))}
function initWorld(){let divisions={};for(let [key,clubs] of Object.entries(LEAGUES))divisions[key]=clubs.map(worldRow);return {version:WORLD_VERSION,divisions,qualifiers:{},results:[],continental:null}}
function ensureWorld(){if(!game.world||game.world.version!==WORLD_VERSION){game.world=initWorld();syncManaged()}return game.world}
function syncManaged(){if(!game||!game.world)return;game.world.divisions[game.league]=game.table.map(r=>({...r,name:CLUBS[r.id]}))}
function simulateWorldRound(){let w=ensureWorld();for(let [key,rows] of Object.entries(w.divisions)){if(key===game.league)continue;let names=rows.map(r=>r.name),offset=(game.round-1)%9;for(let i=0;i<5;i++){let a=rows[(i+offset)%10],b=rows[(9-i+offset)%10];if(a===b)continue;let hg=goals(75+Math.max(0,5-i),75),ag=goals(75,75+Math.max(0,5-i));a.p++;b.p++;a.gf+=hg;a.ga+=ag;b.gf+=ag;b.ga+=hg;if(hg>ag){a.w++;a.pts+=3;b.l++}else if(hg<ag){b.w++;b.pts+=3;a.l++}else{a.d++;b.d++;a.pts++;b.pts++}}}syncManaged()}
const oldFinishWorld=finishRound;finishRound=function(f,h,a){oldFinishWorld(f,h,a);ensureWorld();simulateWorldRound();save()};
function worldMove(divisions){let events=[];for(let chain of DIVISION_LINKS){for(let i=0;i<chain.length-1;i++){let upper=divisions[chain[i]],lower=divisions[chain[i+1]];if(!upper||!lower)continue;let up=worldOrder(upper),down=worldOrder(lower);let relegated=up.slice(-2).map(r=>r.name),promoted=down.slice(0,2).map(r=>r.name);divisions[chain[i]]=upper.filter(r=>!relegated.includes(r.name)).concat(promoted.map(worldRow));divisions[chain[i+1]]=lower.filter(r=>!promoted.includes(r.name)).concat(relegated.map(worldRow));events.push(...promoted.map(x=>'⬆️ '+x+' asciende a '+chain[i]),...relegated.map(x=>'⬇️ '+x+' desciende a '+chain[i+1]))}}return events}
function continentalRegion(key){let c=key.split(' · ')[0];if(['España','Inglaterra','Italia','Alemania','Francia','Portugal','Países Bajos','Bélgica','Escocia','Turquía','Grecia','Austria','Suiza','Dinamarca','Suecia','Noruega','Polonia','Chequia','Croacia'].includes(c))return 'Europa';if(['Brasil','Argentina','Colombia','Chile','Uruguay','Perú','Ecuador','Paraguay'].includes(c))return 'Sudamérica';if(['México','Estados Unidos'].includes(c))return 'Norteamérica';if(['Japón','Corea del Sur','Arabia Saudí','China','India'].includes(c))return 'Asia';if(['Egipto','Marruecos','Sudáfrica','Nigeria'].includes(c))return 'África';return 'Oceanía'}

function buildFixtures(n){let circle=Array.from({length:n},(_,i)=>i);if(n%2)circle.push(-1);let m=circle.length,fixtures=[];for(let r=0;r<m-1;r++){for(let i=0;i<m/2;i++){let a=circle[i],b=circle[m-1-i];if(a<0||b<0)continue;fixtures.push({round:r+1,home:r%2?a:b,away:r%2?b:a,played:false});fixtures.push({round:r+m,home:r%2?b:a,away:r%2?a:b,played:false})}circle=[circle[0],circle[m-1],...circle.slice(1,m-1)]}return fixtures.sort((a,b)=>a.round-b.round)}
const originalMakeExpanded=makeGame;
makeGame=function(team){let g=originalMakeExpanded(team),n=CLUBS.length;if(n!==10){let id=1;g.players=[];for(let c=0;c<n;c++)for(let pos of ['POR','POR','DEF','DEF','DEF','DEF','DEF','DEF','MED','MED','MED','MED','MED','MED','DEL','DEL','DEL','DEL'])g.players.push(player(id++,c,pos));g.market=Array.from({length:36},()=>player(id++,-1,POS[rnd(0,3)]));g.nextId=id;g.table=CLUBS.map((_,i)=>({id:i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));}g.fixtures=buildFixtures(n);g.nationalCup={round:0,alive:true,history:[],winner:false};return g};
simulateWorldRound=function(){let w=ensureWorld();for(let [key,rows] of Object.entries(w.divisions)){if(key===game.league)continue;let n=rows.length,round=(game.round-1)%(2*(n-1)),fixtures=buildFixtures(n).filter(f=>f.round===round+1);for(let f of fixtures){let a=rows[f.home],b=rows[f.away],hg=goals(78,78),ag=goals(78,78);a.p++;b.p++;a.gf+=hg;a.ga+=ag;b.gf+=ag;b.ga+=hg;if(hg>ag){a.w++;a.pts+=3;b.l++}else if(hg<ag){b.w++;b.pts+=3;a.l++}else{a.d++;b.d++;a.pts++;b.pts++}}}syncManaged()};
const priorWorldMove=worldMove;
worldMove=function(divisions){let events=[];for(let chain of DIVISION_LINKS){for(let i=0;i<chain.length-1;i++){let upper=divisions[chain[i]],lower=divisions[chain[i+1]];if(!upper||!lower)continue;let sortedUp=worldOrder(upper),sortedLow=worldOrder(lower),relegated=sortedUp.slice(-2).map(x=>x.name);let direct=sortedLow.slice(0,1).map(x=>x.name),playoff=sortedLow.slice(1,5),playoffWinner=playoff.length?playoff.reduce((best,x)=>Math.random()<.52?best:x).name:null,promoted=[...direct,...(playoffWinner?[playoffWinner]:[])];divisions[chain[i]]=upper.filter(r=>!relegated.includes(r.name)).concat(promoted.map(worldRow));divisions[chain[i+1]]=lower.filter(r=>!promoted.includes(r.name)).concat(relegated.map(worldRow));events.push(...promoted.map(x=>'⬆️ '+x+' asciende a '+chain[i]),...relegated.map(x=>'⬇️ '+x+' desciende a '+chain[i+1]));if(playoffWinner)events.push('🏟️ '+playoffWinner+' gana el playoff de '+chain[i+1])}}return events};
function playNationalCup(){if(!game.nationalCup)game.nationalCup={round:0,alive:true,history:[],winner:false};let c=game.nationalCup;if(!c.alive)return;let opponents=Object.entries(ensureWorld().divisions).filter(([k])=>k.split(' · ')[0]===game.league.split(' · ')[0]).flatMap(([,r])=>r.map(x=>x.name)).filter(x=>x!==CLUBS[game.team]);let rival=opponents[rnd(0,opponents.length-1)]||'Selección regional';let a=goals(avg(game.team)+4,76),b=goals(76,avg(game.team));let win=a>b||(a===b&&Math.random()<.5);c.round++;c.history.unshift('Ronda '+c.round+': '+CLUBS[game.team]+' '+a+' - '+b+' '+rival+(a===b?' (penaltis)':''));if(!win){c.alive=false;addNews('Eliminado de la copa nacional ante '+rival)}else{game.budget+=3;if(c.round>=5){c.alive=false;c.winner=true;game.budget+=25;addNews('🏆 ¡Campeones de la copa nacional!')}}save();go('copaNacional')}

const dbOriginalPlayer=player;
player=function(id,club,pos){let p=dbOriginalPlayer(id,club,pos);p.contractUntil=2030;p.nationality='Sin especificar';p.potential=Math.min(99,p.rating+rnd(2,13));p.apps=0;p.goals=0;p.assists=0;return p};
function normalizePlayer(p){p.contractUntil??=game.season+2;p.nationality??='Sin especificar';p.potential??=Math.min(99,p.rating+8);p.apps??=0;p.goals??=0;p.assists??=0;return p}
function database(){return {format:'football-dynasty-db',version:1,season:game.season,league:game.league,clubs:CLUBS.map((name,id)=>({id,name})),players:game.players.map(normalizePlayer),freeAgents:game.market.map(normalizePlayer)}}
function downloadJSON(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportDatabase(){downloadJSON(database(),'football-dynasty-datos-'+game.season+'.json')}

function editPlayer(id){let p=game.players.find(p=>p.id===id)||game.market.find(p=>p.id===id);if(!p)return;normalizePlayer(p);let name=prompt('Nombre del futbolista:',p.name);if(name===null)return;name=name.trim().slice(0,70);if(!name)return alert('Nombre obligatorio');let rating=prompt('Media (1-99):',p.rating);if(rating===null)return;let age=prompt('Edad (15-45):',p.age);if(age===null)return;let contract=prompt('Año final de contrato:',p.contractUntil);if(contract===null)return;let potential=prompt('Potencial (1-99):',p.potential);if(potential===null)return;let r=Number(rating),a=Number(age),c=Number(contract),pot=Number(potential);if(!Number.isInteger(r)||r<1||r>99||!Number.isInteger(a)||a<15||a>45||!Number.isInteger(c)||c<game.season||c>game.season+12||!Number.isInteger(pot)||pot<1||pot>99)return alert('Valores no válidos');p.name=name;p.rating=r;p.age=a;p.contractUntil=c;p.potential=Math.max(r,pot);save();go('database')}
function readDatabaseFile(input){let file=input.files?.[0];if(!file)return;if(file.size>3e6)return alert('Archivo demasiado grande (máximo 3 MB)');let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(data.format==='football-dynasty-save'&&data.data){let d=data.data;if(!Array.isArray(d.players)||!Array.isArray(d.fixtures)||!LEAGUES[d.league])throw Error('Partida incompatible');if(!confirm('¿Sustituir la partida actual por la importada?'))return;game=d;currentLeague=d.league;CLUBS=LEAGUES[currentLeague];save();go('inicio');return}if(data.format!=='football-dynasty-db'||data.version!==1||!Array.isArray(data.players)||!Array.isArray(data.freeAgents)||data.players.length>3000||data.freeAgents.length>1000||data.league!==game.league)throw Error('Base incompatible. Importa datos de la liga actual.');let all=[...data.players,...data.freeAgents],ids=new Set();for(let p of all){if(!p||!Number.isSafeInteger(p.id)||ids.has(p.id)||!Number.isInteger(p.club)||p.club< -1||p.club>=CLUBS.length||typeof p.name!=='string'||p.name.length>80||!['POR','DEF','MED','DEL'].includes(p.pos)||!Number.isFinite(p.rating)||p.rating<1||p.rating>99||!Number.isInteger(p.age)||p.age<15||p.age>45||!Number.isFinite(p.value)||p.value<0||p.value>1e6)throw Error('Jugador inválido');ids.add(p.id)}if(!confirm('¿Reemplazar la base de jugadores actual?'))return;game.players=data.players.map(normalizePlayer);game.market=data.freeAgents.map(normalizePlayer);game.nextId=Math.max(...ids,0)+1;save();go('database')}catch(e){alert('No se pudo importar: '+e.message)}};reader.readAsText(file)}
function renderDatabase(){let all=game.players.map(normalizePlayer);$('content').innerHTML='<h2>🗂️ Base de datos de futbolistas</h2><p class="muted">Datos de jugadores ficticios editables. Puedes exportar, editar e importar JSON. No se incluyen plantillas reales verificadas ni fotografías oficiales.</p><div class="panel"><div class="actions"><button class="primary" onclick="exportDatabase()">⬇ Exportar jugadores JSON</button><button onclick="exportSave()">💾 Exportar partida</button><label style="display:inline-block;padding:10px;border:1px solid #61798c;border-radius:8px;cursor:pointer">📂 Importar JSON<input type="file" accept=".json,application/json" style="display:none" onchange="readDatabaseFile(this)"></label></div><p class="muted">El JSON de jugadores es editable y específico de la liga actual. Para mover toda tu carrera entre dispositivos, exporta e importa la partida.</p></div><div class="panel scroll"><table><thead><tr><th>Jugador</th><th>Club</th><th>Pos.</th><th>Edad</th><th>Media</th><th>Potencial</th><th>Contrato</th><th>Part.</th><th>Goles</th><th></th></tr></thead><tbody>'+all.filter(p=>p.club===game.team).concat(all.filter(p=>p.club!==game.team)).map(p=>'<tr><td>'+escapeHTML(p.name)+'</td><td>'+escapeHTML(CLUBS[p.club]||'Libre')+'</td><td>'+p.pos+'</td><td>'+p.age+'</td><td>'+p.rating+'</td><td>'+p.potential+'</td><td>'+p.contractUntil+'</td><td>'+p.apps+'</td><td>'+p.goals+'</td><td><button onclick="editPlayer('+p.id+')">Editar</button></td></tr>').join('')+'</tbody></table></div>'}
