function squad(){return game.players.filter(p=>p.club===game.team)}function avg(c){let ps=game.players.filter(p=>p.club===c).sort((a,b)=>b.rating-a.rating).slice(0,11);return ps.reduce((s,p)=>s+p.rating*(.6+.4*p.fitness/100),0)/Math.max(1,ps.length)}

function buy(id){let p=game.market.find(x=>x.id===id);if(!p||p.value>game.budget)return;game.budget-=p.value;p.club=game.team;game.players.push(p);game.market=game.market.filter(x=>x.id!==id);addNews('Fichado '+p.name+' por '+money(p.value));save();renderView()}
function sell(id){let p=squad().find(x=>x.id===id);if(!p||squad().length<=11)return alert('Necesitas al menos 11 jugadores.');if(!confirm('¿Vender a '+p.name+' por '+money(p.value)+'?'))return;game.budget+=p.value;game.players=game.players.filter(x=>x.id!==id);addNews('Traspaso de '+p.name);save();renderView()}
function train(){if(game.lastTraining===game.round)return alert('Ya has entrenado esta jornada.');game.lastTraining=game.round;for(let p of squad()){let f=game.training==='suave'?12:game.training==='intenso'?-12:5;p.fitness=Math.max(45,Math.min(100,p.fitness+f));if(Math.random()<(game.training==='intenso'?.22:.08)&&p.rating<95)p.rating++;}addNews('Sesión de entrenamiento: '+game.training);save();renderView()}
function upgrade(){if(game.budget<20)return;game.budget-=20;game.stadium+=5000;addNews('Estadio ampliado a '+fmt(game.stadium));save();renderView()}
function goals(strength,other){let expectation=Math.max(.35,1.25+(strength-other)*.055);let n=0;for(let i=0;i<6;i++)if(Math.random()<expectation/6)n++;return n}

const WORLD_VERSION=3;

function buildFixtures(n){let circle=Array.from({length:n},(_,i)=>i);if(n%2)circle.push(-1);let m=circle.length,fixtures=[];for(let r=0;r<m-1;r++){for(let i=0;i<m/2;i++){let a=circle[i],b=circle[m-1-i];if(a<0||b<0)continue;fixtures.push({round:r+1,home:r%2?a:b,away:r%2?b:a,played:false});fixtures.push({round:r+m,home:r%2?b:a,away:r%2?a:b,played:false})}circle=[circle[0],circle[m-1],...circle.slice(1,m-1)]}return fixtures.sort((a,b)=>a.round-b.round)}

function realNorm(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function realClubIndex(name){let target=realNorm(name);let norm=CLUBS.map(realNorm);let exact=norm.indexOf(target);if(exact!==-1)return exact;for(let i=0;i<norm.length;i++){let aliases=REAL_ALIASES[norm[i]]||[];if(aliases.some(x=>realNorm(x)===target))return i}return -1}
function realAge(date){let y=Number(String(date).slice(0,4));return Number.isInteger(y)&&y>=1975&&y<=2011?Math.max(15,2026-y):24}
async function importWorldCupSquads(){
 const b=document.getElementById('loadRealSquads');if(b){b.disabled=true;b.textContent='⏳ Descargando datos reales...'}
 try{
  if(!game)throw Error('Primero debes crear o continuar una carrera.');
  const response=await fetch(REAL_SOURCE,{cache:'no-store'});if(!response.ok)throw Error('La fuente no responde: '+response.status);
  const nations=await response.json();if(!Array.isArray(nations)||nations.length<30)throw Error('Datos incompletos');
  const entries=nations.flatMap(n=>Array.isArray(n.players)?n.players.map(p=>({...p,nation:n.name})):[]).filter(p=>p&&typeof p.name==='string'&&typeof p.club?.name==='string');
  if(entries.length<700)throw Error('Faltan jugadores en los datos descargados');
  if(!confirm('Importar '+entries.length+' convocados al Mundial 2026. Solo se actualizarán los clubes que coincidan con los de tu liga y algunos jugadores que sobren pasarán a agentes libres. Se reemplazarán nombres ficticios, pero no tus fichajes actuales. ¿Continuar?'))return;
  let added=0,clubs=new Set(),unmatched=0,used=new Set();
  for(const r of entries){const ci=realClubIndex(r.club.name),position=({GK:'POR',DF:'DEF',MF:'MED',FW:'DEL'})[r.pos]||'MED';
   if(ci===-1){unmatched++;continue}
   if(used.has(realNorm(r.name)))continue;used.add(realNorm(r.name));
   const already=game.players.some(p=>realNorm(p.name)===realNorm(r.name));if(already)continue;
   // Sustituye primero jugadores generados; nunca elimina fichajes reales importados.
   const fake=game.players.find(p=>p.club===ci&&!p.realData&&p.pos===position)||game.players.find(p=>p.club===ci&&!p.realData);
   if(!fake)continue;
   fake.name=r.name.slice(0,80);fake.pos=position;fake.age=realAge(r.date_of_birth);fake.nationality=r.nation;fake.realData=true;fake.dataSource='Mundial 2026 / OpenFootball';fake.sourceClub=r.club.name;fake.sourceDate='2026';fake.potential=Math.max(fake.rating,Math.min(99,fake.rating+6));
   clubs.add(ci);added++;
  }
  game.realImport={count:added,sourceTotal:entries.length,clubs:clubs.size,league:game.league,date:'Mundial 2026'};
  save();go('database');alert('✅ '+added+' nombres reales incorporados a '+clubs.size+' clubes de tu liga. Los restantes no corresponden a clubes seleccionados o no están en el catálogo. Valores, sueldos y atributos siguen siendo estimados por el juego.');
 }catch(err){alert('No se pudieron cargar las convocatorias: '+err.message+'\nComprueba tu conexión a internet. También puedes importar tu propio archivo JSON.');}
 finally{let button=document.getElementById('loadRealSquads');if(button){button.disabled=false;button.textContent='🌍 IMPORTAR JUGADORES REALES · MUNDIAL 2026'}}
}

 const panel=document.createElement('section');panel.className='panel';panel.innerHTML='<h3>🌍 Jugadores reales · Mundial 2026</h3><p class="muted">Fuente: OpenFootball (CC0). Convocatorias de selecciones en 2026, NO todas las plantillas completas ni fichajes actualizados a octubre. Solo se asignan futbolistas a los clubes identificados en esta liga; se mantiene el resto ficticio. Las medias, salarios y valores son simulados.</p><p><strong>Jugadores reales en esta liga: '+count+'</strong></p><div class="actions"><button class="primary" id="loadRealSquads" onclick="importWorldCupSquads()">🌍 IMPORTAR JUGADORES REALES · MUNDIAL 2026</button><button onclick="exportDatabase()">⬇ Guardar mi base JSON</button></div><p class="muted">Necesita conexión a internet la primera vez. Los cambios quedan en tu partida de Safari. Para otra liga, inicia una carrera nueva y vuelve a importar.</p>';
 root.insertBefore(panel,root.children[1]||null);
};
